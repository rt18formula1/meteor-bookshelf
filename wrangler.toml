name = "meteor-bookshelf"
main = "src/index.js"
compatibility_date = "2025-11-01"

[vars]
FIREBASE_PROJECT_ID = "meteor-bookshelf"

[assets]
directory = "./web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "meteor-bookshelf-db"
database_id = "0f826884-9cad-4760-81ce-a79553426b3d"

[[kv_namespaces]]
binding = "IMAGES"
id = "ce377a431ffd49109d95da61b942e697"

# 画像の保存先は R2（本命）。KV バインディングは旧キーの読み取り互換用に残す
[[r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "meteor-bookshelf-images"
